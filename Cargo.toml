[workspace]
members = [
  "happ/zomes/profiles",
  "happ/zomes/profiles_integrity",
  "happ/zomes/projects",
  "happ/zomes/projects_integrity",
]
resolver = "2"

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"

[workspace.dependencies]
hdi = { version = "0.5.0-dev.5" }
hdk = { version = "0.4.0-dev.5" }
holochain = { version = "0.4.0-dev.5" }
holo_hash = {version = "0.4.0-dev.5", features = ["encoding"]}
hdk_crud = { version = "0.13.0", features = ["no_example"] }